name: Cloud.ru container build

on:
  workflow_dispatch:

jobs:
  validate-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout integration/potok
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6

      - name: Deno check
        run: deno check container/main.ts

      - name: Run tests
        run: deno test --allow-env --allow-read tests/

      - name: Login to Cloud.ru Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ai-travel-offer-bot.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_REGISTRY_USERNAME }}
          password: ${{ secrets.CLOUDRU_REGISTRY_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ai-travel-offer-bot.cr.cloud.ru/ai-travel-offer-bot:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ai-travel-offer-bot.cr.cloud.ru/ai-travel-offer-bot:${{ github.sha }}
