          const workflow = '.github/workflows/kt02-test-build.yml';
          function walk(dir = '.', prefix = '') {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const relative = prefix + entry.name;
              if (relative === '.git') return [];
              assert.ok(!entry.isSymbolicLink(), 'Symlinks are not allowed: ' + relative);
              return entry.isDirectory() ? walk(path.join(dir, entry.name), relative + '/') : [relative];
            });
          }
          assert.deepEqual(walk().sort(), [...Object.keys(expected), workflow].sort(), 'Unexpected or missing source files');
          for (const [file, hash] of Object.entries(expected)) {
            const text = fs.readFileSync(file).toString('utf8').replaceAll('\r\n', '\n');
            assert.equal(crypto.createHash('sha256').update(text).digest('hex'), hash, 'Source mismatch: ' + file);
          }
          const lock = JSON.parse(fs.readFileSync('deno.lock', 'utf8'));
          assert.deepEqual(Object.keys(lock.npm).sort(), ['@types/node@24.2.0', 'undici-types@7.10.0', 'zod@4.4.3']);
          assert.equal(lock.specifiers['npm:@types/node@*'], '24.2.0');
          assert.equal(lock.specifiers['npm:zod@4.4.3'], '4.4.3');
