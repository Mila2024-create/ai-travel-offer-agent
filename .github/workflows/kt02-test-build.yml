      - name: Set up Deno 2.5.6
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Check types and mocked tests with frozen dependencies
        run: |-
          deno --version
          mapfile -t test_files < <(find tests/unit tests/parser tests/tourvisor tests/spike tests/telegram-webhook tests/container -type f -name '*.test.ts' | sort)
          deno check --frozen container/main.ts supabase/functions/telegram-webhook/index.ts "${test_files[@]}"
          deno test --cached-only --frozen --deny-net --deny-import --allow-read --allow-env=OPENROUTER_API_KEY,OPENROUTER_MODEL,TOURVISOR_JWT,SUPABASE_URL tests/unit tests/parser tests/tourvisor tests/spike tests/telegram-webhook tests/container
          git diff --exit-code -- deno.lock
        env:
          DENO_DIR: ${{ runner.temp }}/kt02-deno-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Form unique test image tag
        id: image
        run: |-
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const e = process.env;
          assert.match(e.SOURCE_SHA, /^[0-9a-f]{40}$/);
          assert.match(e.GITHUB_RUN_ID, /^\d+$/);
          assert.match(e.GITHUB_RUN_ATTEMPT, /^\d+$/);
          assert.equal(e.IMAGE_REPOSITORY, 'ai-travel-offer-bot.cr.cloud.ru/ai-travel-offer-kt02-test');
          const tag = 'kt02-' + e.SOURCE_SHA + '-' + e.GITHUB_RUN_ID + '-' + e.GITHUB_RUN_ATTEMPT;
          fs.appendFileSync(e.GITHUB_OUTPUT, 'image=' + e.IMAGE_REPOSITORY + ':' + tag + '\n');
          NODE
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ai-travel-offer-bot.cr.cloud.ru
          username: ${{ secrets.CLOUDRU_REGISTRY_USERNAME }}
          password: ${{ secrets.CLOUDRU_REGISTRY_PASSWORD }}
      - name: Build and publish only the KT-02 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.image }}
          labels: org.opencontainers.image.revision=${{ inputs.source_sha }}
          provenance: false
          sbom: false
      - name: Record published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: ${{ steps.image.outputs.image }}
        run: |-
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const e = process.env;
          assert.match(e.IMAGE_DIGEST || '', /^sha256:[0-9a-f]{64}$/);
          assert.ok(e.IMAGE_TAG.startsWith(e.IMAGE_REPOSITORY + ':kt02-'));
          const result = {
            repository: e.IMAGE_REPOSITORY,
            tag: e.IMAGE_TAG,
            digest: e.IMAGE_DIGEST,
            immutable_reference: e.IMAGE_REPOSITORY + '@' + e.IMAGE_DIGEST,
            source_commit: e.SOURCE_SHA,
            run_id: e.GITHUB_RUN_ID,
            run_attempt: e.GITHUB_RUN_ATTEMPT,
            approved_base_archive_sha256: '11b67ac3bb5689f32ba760b5da8b4fe7771ed951186f893a8f9e8eb2f6d036c1',
          };
          const destination = path.join(e.RUNNER_TEMP, 'kt02-image');
          fs.mkdirSync(destination, { recursive: true });
          fs.writeFileSync(path.join(destination, 'image.json'), JSON.stringify(result, null, 2) + '\n');
          fs.appendFileSync(e.GITHUB_STEP_SUMMARY, 'KT-02 image: ' + result.immutable_reference + '\n\nSource commit: ' + e.SOURCE_SHA + '\n');
          NODE
      - name: Save digest and source provenance
        uses: actions/upload-artifact@v4
        with:
          name: kt02-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kt02-image/image.json
          if-no-files-found: error
          retention-days: 90
