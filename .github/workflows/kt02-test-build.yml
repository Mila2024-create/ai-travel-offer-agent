# Local preparation only: no build, publication or deployment has been run.
# source_sha must equal the selected workflow ref commit.
# Source snapshot hashes normalize CRLF to LF for checkout portability.
name: KT-02 isolated test image
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Approved full commit SHA containing the prepared snapshot and this workflow
        required: true
        type: string
      confirmation:
        description: Explicit publication approval for the KT-02 image repository only
        required: true
        type: choice
        default: DO_NOT_PUBLISH
        options:
          - DO_NOT_PUBLISH
          - KT02_TEST_ONLY
permissions:
  contents: read
concurrency:
  group: kt02-test-build-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE_REPOSITORY: ai-travel-offer-bot.cr.cloud.ru/ai-travel-offer-kt02-test
  SOURCE_SHA: ${{ inputs.source_sha }}
  CONFIRMATION: ${{ inputs.confirmation }}
jobs:
  validate-and-publish-test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Require approval and exact source commit
        run: |-
          node <<'NODE'
          const assert = require('node:assert/strict');
          const e = process.env;
          assert.equal(e.GITHUB_EVENT_NAME, 'workflow_dispatch');
          assert.equal(e.GITHUB_REPOSITORY, 'Mila2024-create/ai-travel-offer-agent');
          assert.equal(e.CONFIRMATION, 'KT02_TEST_ONLY');
          assert.match(e.SOURCE_SHA || '', /^[0-9a-f]{40}$/);
          assert.equal(e.SOURCE_SHA, e.GITHUB_SHA, 'Dispatch from the approved commit itself');
          assert.equal(e.IMAGE_REPOSITORY, 'ai-travel-offer-bot.cr.cloud.ru/ai-travel-offer-kt02-test');
          assert.match(e.GITHUB_RUN_ID || '', /^\d+$/);
          assert.match(e.GITHUB_RUN_ATTEMPT || '', /^\d+$/);
          NODE
      - name: Checkout the approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify approved source snapshot
        run: |-
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
